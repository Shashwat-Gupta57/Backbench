<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Google Account</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #000;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 30px;
      max-width: 400px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 28px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn img {
      width: 24px;
      height: 24px;
    }
    #status { margin-top: 16px; color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container" id="app-container">
    <div style="font-size: 48px; margin-bottom: 20px;">🎓</div>
    <h2>Connect to Backbench</h2>
    <p style="color: #aaa;">Link your student account to continue.</p>
    
    <button id="google-btn" class="btn" disabled>
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G">
      Continue with Google
    </button>
    <div id="status">Loading secure session...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYnd63Dwmhq0F-AWlWo1nTmoYX9TPO9DM",
      authDomain: "backbench-ef95e.firebaseapp.com",
      projectId: "backbench-ef95e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');

    const statusEl = document.getElementById('status');
    const containerEl = document.getElementById('app-container');
    const btn = document.getElementById('google-btn');

    // 1. Capture and save callback URL to localStorage (more reliable than sessionStorage in Custom Tabs)
    const urlParams = new URLSearchParams(window.location.search);
    const callbackParam = urlParams.get('callback');
    if (callbackParam) {
      localStorage.setItem('authCallback', callbackParam);
    }
    
    const getCallbackUrl = () => localStorage.getItem('authCallback');

    function renderSuccess(idToken, accessToken) {
      const cb = getCallbackUrl();
      if (!cb) {
        containerEl.innerHTML = "<h2>Error</h2><p>Authentication succeeded but no callback URL was found to return to the app.</p>";
        return;
      }
      
      const targetUrl = new URL(cb);
      targetUrl.searchParams.set('idToken', idToken || '');
      targetUrl.searchParams.set('accessToken', accessToken || '');
      const finalUrl = targetUrl.toString();
      
      containerEl.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
        <h2>Success!</h2>
        <p style="color: #aaa; margin-bottom: 24px;">Taking you back to the app...</p>
        <a href="${finalUrl}" class="btn" style="background: #1D9BF0; color: #fff;">Return to App</a>
      `;
      window.location.href = finalUrl;
    }

    // 2. Safely check redirect results. getRedirectResult() can be slow or transiently
    // return null right after the redirect-back page load (Firebase reads pending-redirect
    // state from IndexedDB, which can race with page init), so retry a few times before
    // concluding there's genuinely no pending redirect. Only coming back from Google should
    // ever hit this path, since we only navigate away via signInWithRedirect below.
    async function checkRedirect() {
      const cameFromRedirect = !!getCallbackUrl() && sessionStorage.getItem('bb_awaiting_redirect') === '1';

      const attempts = cameFromRedirect ? 6 : 1;
      const delayMs = 700;

      for (let i = 0; i < attempts; i++) {
        try {
          const result = await getRedirectResult(auth);
          if (result) {
            const credential = GoogleAuthProvider.credentialFromResult(result);
            if (credential) {
              sessionStorage.removeItem('bb_awaiting_redirect');
              renderSuccess(credential.idToken, credential.accessToken);
              return;
            }
          }
        } catch (err) {
          console.error("Redirect check failed:", err);
          sessionStorage.removeItem('bb_awaiting_redirect');
          statusEl.textContent = "Sign-in failed: " + (err.message || err.code || "unknown error");
          statusEl.style.color = "#ff4444";
          btn.disabled = false;
          return;
        }
        if (i < attempts - 1) {
          await new Promise((resolve) => setTimeout(resolve, delayMs));
        }
      }

      if (cameFromRedirect) {
        // We returned from Google but never got a usable result after retrying -
        // don't silently loop back to the button, tell the user plainly.
        sessionStorage.removeItem('bb_awaiting_redirect');
        statusEl.textContent = "Couldn't complete sign-in. Please try again.";
        statusEl.style.color = "#ff4444";
      } else {
        statusEl.textContent = "";
      }

      // No result found, enable the button for the user
      btn.disabled = false;
    }

    // 3. Handle explicit button click (Popup first, fallback to redirect)
    btn.addEventListener('click', async () => {
      if (!getCallbackUrl()) {
        statusEl.textContent = "Error: Cannot sign in without a callback URL.";
        statusEl.style.color = "#ff4444";
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = `<div class="spinner" style="width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.1); border-top: 2px solid #000; border-radius: 50%; animation: spin 1s linear infinite;"></div> Connecting...`;
        statusEl.textContent = "Opening Google Sign-In...";
        
        // Try popup first (highly reliable on Android Chrome Custom Tabs when triggered by a direct click)
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        renderSuccess(credential.idToken, credential.accessToken);
        
      } catch (err) {
        console.warn("Popup auth failed or blocked, trying redirect fallback:", err);
        statusEl.textContent = "Redirecting to Google...";
        // If popup was blocked or failed, gracefully fallback to redirect
        sessionStorage.setItem('bb_awaiting_redirect', '1');
        await signInWithRedirect(auth, provider);
      }
    });

    // Start
    checkRedirect();
  </script>
</body>
</html>
