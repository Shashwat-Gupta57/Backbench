<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating with Google...</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #000;
      color: #fff;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #00BA7C;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .container { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" style="margin: 0 auto 20px auto;"></div>
    <h2>Authenticating securely...</h2>
    <p>Please wait while we connect your account.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYnd63Dwmhq0F-AWlWo1nTmoYX9TPO9DM",
      authDomain: "backbench-ef95e.firebaseapp.com",
      projectId: "backbench-ef95e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    async function authenticate() {
      try {
        const result = await getRedirectResult(auth);
        if (result) {
          const credential = GoogleAuthProvider.credentialFromResult(result);
          if (credential) {
            const idToken = credential.idToken;
            const accessToken = credential.accessToken;
            const callback = sessionStorage.getItem('authCallback');
            
            if (callback) {
              const targetUrl = new URL(callback);
              targetUrl.searchParams.set('idToken', idToken || '');
              targetUrl.searchParams.set('accessToken', accessToken || '');
              
              const finalUrl = targetUrl.toString();
              
              document.querySelector('.container').innerHTML = `
                <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
                <h2>Authentication Successful!</h2>
                <p style="margin-bottom: 24px; color: #888;">If you are not automatically redirected, please tap the button below.</p>
                <a href="${finalUrl}" style="display: inline-block; padding: 14px 28px; background: #1D9BF0; color: #fff; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 16px;">Return to Backbench</a>
              `;
              
              // Attempt automatic redirect
              window.location.href = finalUrl;
              return;
            }
          }
        }
      } catch (error) {
        document.querySelector('.container').innerHTML = \`<h2>Auth Failed</h2><p>\${error.message}</p>\`;
        return;
      }

      // If not returning from redirect, start it.
      const urlParams = new URLSearchParams(window.location.search);
      const callback = urlParams.get('callback');
      if (callback) {
        sessionStorage.setItem('authCallback', callback);
        await signInWithRedirect(auth, provider);
      } else {
        document.querySelector('.container').innerHTML = "<h2>Error</h2><p>No callback provided.</p>";
      }
    }

    authenticate();
  </script>
</body>
</html>
