<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating with Google...</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #000;
      color: #fff;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #00BA7C;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .container { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" style="margin: 0 auto 20px auto;"></div>
    <h2>Authenticating securely...</h2>
    <p>Please wait while we connect your account.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYnd63Dwmhq0F-AWlWo1nTmoYX9TPO9DM",
      authDomain: "backbench-ef95e.firebaseapp.com",
      projectId: "backbench-ef95e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    async function authenticate() {
      const urlParams = new URLSearchParams(window.location.search);
      const callback = urlParams.get('callback');
      if (!callback) {
        document.querySelector('.container').innerHTML = "<h2>Error</h2><p>No callback provided.</p>";
        return;
      }

      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        
        if (credential) {
          const idToken = credential.idToken;
          const accessToken = credential.accessToken;
          
          // Redirect back to the native app with the tokens
          const targetUrl = new URL(callback);
          targetUrl.searchParams.set('idToken', idToken || '');
          targetUrl.searchParams.set('accessToken', accessToken || '');
          
          window.location.href = targetUrl.toString();
        } else {
          throw new Error("No credential returned from Google.");
        }
      } catch (error) {
        document.querySelector('.container').innerHTML = `<h2>Auth Failed</h2><p>${error.message}</p>`;
      }
    }

    authenticate();
  </script>
</body>
</html>
